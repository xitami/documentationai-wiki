openapi: 3.0.0
info:
  version: 1.0.0
  title: TWG TourData API
  description: API for the TWG TourData platform, covering trips, bookings, customers, feedback, notes, aggregates, alerts, events, and more. All endpoints are mounted under `/api/v1`.
  contact:
    name: TWG API Support
  license:
    name: MIT
servers:
  - url: https://api.twg.com/api/v1
tags:
  - name: Health
    description: Service health and readiness checks.
  - name: Trips
    description: Trip and departure data.
  - name: Bookings
    description: Booking and participant data.
  - name: Customers
    description: Customer and person data.
  - name: Notes
    description: Notes attached to platform entities.
  - name: Aggregates
    description: Dataset metadata and aggregate queries.
  - name: Feedback
    description: Survey feedback, sentiment, and recommendations.
  - name: Alerts
    description: Alert metrics, rules, channels, and inbox.
  - name: Events
    description: Event catalog and delivery formats.
  - name: Sync
    description: Data synchronization status and refresh operations.
  - name: Reference
    description: Reference data catalogs.
  - name: Graph
    description: Entity relationship graphs.
  - name: Dispositions
    description: Departure disposition assignments.
  - name: Dispo
    description: Planning and staff assignments.
  - name: Mail
    description: Outbound mail and templates.
  - name: KDDoc
    description: Knowledge document and asset operations.
security:
  - BearerAuth: []
paths:
  /health:
    get:
      tags:
        - Health
      summary: Get health status
      description: Returns the service health status.
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
  /ready:
    get:
      tags:
        - Health
      summary: Get readiness status
      description: Returns the service readiness status.
      operationId: getReadiness
      security: []
      responses:
        '200':
          description: Service is ready.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ready
  /trips:
    get:
      tags:
        - Trips
      summary: List trips
      description: Lists trips using cursor pagination and optional filters.
      operationId: listTrips
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: trip_category
          in: query
          description: Trip category filter.
          schema:
            type: string
        - name: code_prefix
          in: query
          description: Trip code prefix.
          schema:
            type: string
        - name: q
          in: query
          description: Full-text search query.
          schema:
            type: string
        - name: country_id
          in: query
          description: Country identifier.
          schema:
            type: integer
        - name: country
          in: query
          description: Country name.
          schema:
            type: string
        - name: departure_from
          in: query
          description: Earliest departure date.
          schema:
            type: string
            format: date
        - name: departure_to
          in: query
          description: Latest departure date.
          schema:
            type: string
            format: date
        - name: price_min
          in: query
          description: Minimum price.
          schema:
            type: number
        - name: price_max
          in: query
          description: Maximum price.
          schema:
            type: number
        - name: duration_min
          in: query
          description: Minimum duration.
          schema:
            type: integer
        - name: duration_max
          in: query
          description: Maximum duration.
          schema:
            type: integer
        - name: rating_min
          in: query
          description: Minimum rating.
          schema:
            type: number
        - name: has_ship
          in: query
          description: Filter by ship availability.
          schema:
            type: boolean
        - name: bus_class
          in: query
          description: Bus class filter.
          schema:
            type: string
        - name: is_guaranteed
          in: query
          description: Filter guaranteed trips.
          schema:
            type: boolean
        - name: is_sold_out
          in: query
          description: Filter sold-out trips.
          schema:
            type: boolean
        - name: is_new
          in: query
          description: Filter new trips.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Limit500'
        - $ref: '#/components/parameters/Cursor'
        - name: sort
          in: query
          description: Sort order.
          schema:
            type: string
            enum:
              - code
              - departure
              - updated
              - new
              - rating
              - price
              - duration
      responses:
        '200':
          description: Trips returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTripResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /trips/departures:
    get:
      tags:
        - Trips
      summary: List trip departures
      description: Lists departures matching a trip code prefix and date range.
      operationId: listTripDepartures
      parameters:
        - name: code_prefix
          in: query
          description: Trip code prefix.
          required: true
          schema:
            type: string
        - name: departure_from
          in: query
          description: Earliest departure date.
          schema:
            type: string
            format: date
            default: '2026-01-01'
        - name: departure_to
          in: query
          description: Latest departure date.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Limit2000'
      responses:
        '200':
          description: Departures returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartureList'
  /trips/{trip_id}:
    get:
      tags:
        - Trips
      summary: Get a trip
      description: Returns a trip by numeric identifier.
      operationId: getTrip
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Trip returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{trip_id}/realization:
    get:
      tags:
        - Trips
      summary: Get trip realization
      description: Returns realization details, sample booking, providers, and service counts.
      operationId: getTripRealization
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Realization returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripRealization'
        '404':
          $ref: '#/components/responses/NotFound'
  /trips/{trip_id}/similar:
    get:
      tags:
        - Trips
      summary: List similar trips
      description: Returns trips similar to the specified trip.
      operationId: listSimilarTrips
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/Limit50'
      responses:
        '200':
          description: Similar trips returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimilarTripsResponse'
  /bookings:
    get:
      tags:
        - Bookings
      summary: List bookings
      description: Lists bookings with cursor pagination. Customer address and club membership fields are included when available.
      operationId: listBookings
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: trip_id
          in: query
          description: Trip identifier.
          schema:
            type: integer
        - name: customer_id
          in: query
          description: Customer identifier.
          schema:
            type: integer
        - name: status
          in: query
          description: Booking status.
          schema:
            type: string
        - name: dsid
          in: query
          description: Source dossier identifier.
          schema:
            type: string
        - name: trip_start_from
          in: query
          description: Earliest trip start date.
          schema:
            type: string
            format: date
        - name: trip_start_to
          in: query
          description: Latest trip start date.
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Limit500'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Bookings returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /bookings/stats:
    get:
      tags:
        - Bookings
      summary: Get booking statistics
      description: Returns grouped booking statistics.
      operationId: getBookingStats
      parameters:
        - name: group_by
          in: query
          description: Grouping dimension.
          required: true
          schema:
            type: string
            enum:
              - trip
              - tenant
              - status
              - kind
              - month
              - customer
              - sales_agent
        - name: order_by
          in: query
          description: Ordering measure.
          schema:
            type: string
            enum:
              - bookings
              - pax
              - invoice_total
              - paid_total
        - $ref: '#/components/parameters/TenantId'
        - name: status
          in: query
          description: Booking status.
          schema:
            type: string
        - name: trip_id
          in: query
          description: Trip identifier.
          schema:
            type: integer
        - name: limit
          in: query
          description: Maximum number of groups.
          schema:
            type: integer
      responses:
        '200':
          description: Statistics returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingStatsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
  /bookings/departure-crew:
    get:
      tags:
        - Bookings
      summary: Get departure crew
      description: Returns guides and drivers assigned to a departure.
      operationId: getDepartureCrew
      parameters:
        - $ref: '#/components/parameters/TripCodeRequired'
        - $ref: '#/components/parameters/DepartureDateRequired'
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Crew returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepartureCrew'
  /bookings/manifest:
    get:
      tags:
        - Bookings
      summary: Get departure manifest
      description: Returns participant manifest rows without guest phone numbers.
      operationId: getBookingManifest
      parameters:
        - $ref: '#/components/parameters/TripCodeRequired'
        - $ref: '#/components/parameters/DepartureDateRequired'
      responses:
        '200':
          description: Manifest returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestResponse'
  /bookings/{booking_id}:
    get:
      tags:
        - Bookings
      summary: Get a booking
      description: Returns full booking JSON including participants, invoices, and services.
      operationId: getBooking
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Booking returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '404':
          $ref: '#/components/responses/NotFound'
  /bookings/{booking_id}/graph:
    get:
      tags:
        - Graph
      summary: Get booking graph
      description: Returns the relationship graph centered on a booking.
      operationId: getBookingGraph
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Graph returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /bookings/{booking_id}/hotels:
    get:
      tags:
        - Bookings
      summary: Get booking hotels
      description: Returns hotels associated with a booking.
      operationId: getBookingHotels
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: Hotels returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingHotels'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{customer_id}:
    get:
      tags:
        - Customers
      summary: Get a customer
      description: Returns customer details including address and club membership data.
      operationId: getCustomer
      parameters:
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Customer returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
        '404':
          $ref: '#/components/responses/NotFound'
  /customers/{customer_id}/bookings:
    get:
      tags:
        - Customers
      summary: List customer bookings
      description: Lists bookings for a customer.
      operationId: listCustomerBookings
      parameters:
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/Limit500'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Customer bookings returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerBookingsResponse'
  /persons/{person_id}:
    get:
      tags:
        - Customers
      summary: Get a person
      description: Returns a person by numeric identifier.
      operationId: getPerson
      parameters:
        - $ref: '#/components/parameters/PersonId'
      responses:
        '200':
          description: Person returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '404':
          $ref: '#/components/responses/NotFound'
  /notes:
    get:
      tags:
        - Notes
      summary: List notes
      description: Lists notes for an entity.
      operationId: listNotes
      parameters:
        - name: entity_type
          in: query
          description: Entity type.
          required: true
          schema:
            type: string
            enum:
              - booking
              - trip
              - customer
        - name: entity_key
          in: query
          description: Entity key.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notes returned.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - count
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Note'
                  count:
                    type: integer
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags:
        - Notes
      summary: Create a note
      description: Creates a note with Markdown or UI content.
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '201':
          description: Note created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
  /notes/{note_id}:
    patch:
      tags:
        - Notes
      summary: Update a note
      description: Updates note fields or content.
      operationId: updateNote
      parameters:
        - $ref: '#/components/parameters/NoteId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteRequest'
      responses:
        '200':
          description: Note updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Notes
      summary: Delete a note
      description: Deletes a note.
      operationId: deleteNote
      parameters:
        - $ref: '#/components/parameters/NoteId'
      responses:
        '204':
          description: Note deleted.
        '404':
          $ref: '#/components/responses/NotFound'
  /aggregates:
    get:
      tags:
        - Aggregates
      summary: Describe aggregate datasets
      description: Returns datasets, measures, dimensions, limits, and caller policy.
      operationId: describeAggregates
      responses:
        '200':
          description: Aggregate capabilities returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateDescription'
        '403':
          $ref: '#/components/responses/Forbidden'
  /aggregates/{dataset}/query:
    post:
      tags:
        - Aggregates
      summary: Query an aggregate dataset
      description: Executes a structured aggregate query. Supports ETag and If-None-Match.
      operationId: queryAggregateDataset
      parameters:
        - $ref: '#/components/parameters/Dataset'
        - $ref: '#/components/parameters/IfNoneMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AggregateQueryRequest'
      responses:
        '200':
          description: Aggregate results returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateQueryResponse'
        '304':
          description: Results have not changed.
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /aggregates/{dataset}/values:
    get:
      tags:
        - Aggregates
      summary: List aggregate dimension values
      description: Returns dimension values with normalized feedback semantics and human-readable labels.
      operationId: listAggregateValues
      parameters:
        - $ref: '#/components/parameters/Dataset'
        - name: dimension
          in: query
          description: Dimension name.
          required: true
          schema:
            type: string
        - name: from
          in: query
          description: Start of the time range.
          schema:
            type: string
        - name: to
          in: query
          description: End of the time range.
          schema:
            type: string
      responses:
        '200':
          description: Dimension values returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AggregateValuesResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /feedback/summary:
    get:
      tags:
        - Feedback
      summary: Get feedback summary
      description: Returns high-level feedback totals and sentiment distribution.
      operationId: getFeedbackSummary
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /feedback/insights:
    get:
      tags:
        - Feedback
      summary: Get feedback insights
      description: Returns feedback insights with optional trip, driver, guide, sentiment, theme, and date filters.
      operationId: getFeedbackInsights
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: trip_code
          in: query
          description: Comma-separated trip codes.
          schema:
            type: string
        - name: code_prefix
          in: query
          description: Trip code prefix filter.
          schema:
            type: string
        - name: driver
          in: query
          description: Substring match on driver name.
          schema:
            type: string
        - name: guide
          in: query
          description: Exact guide name from scheduling data.
          schema:
            type: string
        - name: sentiment
          in: query
          description: Comma-separated sentiment values (positive, mixed, neutral, negative).
          schema:
            type: string
        - name: theme
          in: query
          description: Comma-separated theme values.
          schema:
            type: string
        - name: departure_from
          in: query
          description: Earliest departure date.
          schema:
            type: string
            format: date
        - name: departure_to
          in: query
          description: Latest departure date.
          schema:
            type: string
            format: date
        - name: created_from
          in: query
          description: Earliest created timestamp.
          schema:
            type: string
            format: date-time
        - name: created_to
          in: query
          description: Latest created timestamp.
          schema:
            type: string
            format: date-time
        - name: reiseart
          in: query
          description: Comma-separated travel categories.
          schema:
            type: string
        - name: freetext_only
          in: query
          description: Filter to surveys with free-text responses only.
          schema:
            type: boolean
            default: false
        - name: top
          in: query
          description: Number of top items per category.
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /feedback/nps:
    get:
      tags:
        - Feedback
      summary: Get NPS results
      description: Returns NPS results and trends using the feedback filter set.
      operationId: getFeedbackNps
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: trip_code
          in: query
          description: Comma-separated trip codes.
          schema:
            type: string
        - name: code_prefix
          in: query
          description: Trip code prefix filter.
          schema:
            type: string
        - name: driver
          in: query
          description: Substring match on driver name.
          schema:
            type: string
        - name: guide
          in: query
          description: Exact guide name from scheduling data.
          schema:
            type: string
        - name: sentiment
          in: query
          description: Comma-separated sentiment values (positive, mixed, neutral, negative).
          schema:
            type: string
        - name: theme
          in: query
          description: Comma-separated theme values.
          schema:
            type: string
        - name: departure_from
          in: query
          description: Earliest departure date.
          schema:
            type: string
            format: date
        - name: departure_to
          in: query
          description: Latest departure date.
          schema:
            type: string
            format: date
        - name: created_from
          in: query
          description: Earliest created timestamp.
          schema:
            type: string
            format: date-time
        - name: created_to
          in: query
          description: Latest created timestamp.
          schema:
            type: string
            format: date-time
        - name: reiseart
          in: query
          description: Comma-separated travel categories.
          schema:
            type: string
        - name: freetext_only
          in: query
          description: Filter to surveys with free-text responses only.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /feedback/avg-ratings:
    get:
      tags:
        - Feedback
      summary: Get average ratings
      description: Returns question-level rating aggregates.
      operationId: getFeedbackAverageRatings
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: trip_code
          in: query
          description: Comma-separated trip codes.
          schema:
            type: string
        - name: code_prefix
          in: query
          description: Trip code prefix filter.
          schema:
            type: string
        - name: driver
          in: query
          description: Substring match on driver name.
          schema:
            type: string
        - name: guide
          in: query
          description: Exact guide name from scheduling data.
          schema:
            type: string
        - name: sentiment
          in: query
          description: Comma-separated sentiment values (positive, mixed, neutral, negative).
          schema:
            type: string
        - name: theme
          in: query
          description: Comma-separated theme values.
          schema:
            type: string
        - name: departure_from
          in: query
          description: Earliest departure date.
          schema:
            type: string
            format: date
        - name: departure_to
          in: query
          description: Latest departure date.
          schema:
            type: string
            format: date
        - name: created_from
          in: query
          description: Earliest created timestamp.
          schema:
            type: string
            format: date-time
        - name: created_to
          in: query
          description: Latest created timestamp.
          schema:
            type: string
            format: date-time
        - name: reiseart
          in: query
          description: Comma-separated travel categories.
          schema:
            type: string
        - name: freetext_only
          in: query
          description: Filter to surveys with free-text responses only.
          schema:
            type: boolean
            default: false
        - name: limit
          in: query
          description: Maximum number of rating rows.
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /feedback/surveys:
    get:
      tags:
        - Feedback
      summary: List surveys
      description: Lists surveys with cursor pagination.
      operationId: listFeedbackSurveys
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: trip_code
          in: query
          description: Comma-separated trip codes.
          schema:
            type: string
        - name: departure_from
          in: query
          description: Earliest departure date.
          schema:
            type: string
            format: date
        - name: departure_to
          in: query
          description: Latest departure date.
          schema:
            type: string
            format: date
        - name: include_raw
          in: query
          description: Include raw survey data.
