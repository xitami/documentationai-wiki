          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /dispo/snapshot:
    get:
      tags:
        - Dispo
      summary: Get planning snapshot
      description: Returns a complete planning snapshot for a season.
      operationId: getDispoSnapshot
      parameters:
        - $ref: '#/components/parameters/TenantIdRequired'
        - name: season_from
          in: query
          description: Season start.
          required: true
          schema:
            type: string
            format: date
        - name: season_to
          in: query
          description: Season end.
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '422':
          $ref: '#/components/responses/ValidationError'
  /dispo/runs:
    post:
      tags:
        - Dispo
      summary: Create a disposition run
      description: Creates a planning run with proposals.
      operationId: createDispoRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenant_id
                - dates
                - profile
                - start_user
                - proposals
              properties:
                tenant_id:
                  type: string
                dates:
                  type: array
                  items:
                    type: string
                profile:
                  type: object
                  additionalProperties: true
                start_user:
                  type: string
                proposals:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
      responses:
        '201':
          $ref: '#/components/responses/GenericSuccess'
    get:
      tags:
        - Dispo
      summary: List disposition runs
      description: Lists planning runs for a tenant.
      operationId: listDispoRuns
      parameters:
        - $ref: '#/components/parameters/TenantIdRequired'
        - name: limit
          in: query
          description: Maximum number of runs.
          schema:
            type: integer
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /dispo/runs/{run_id}/proposals:
    get:
      tags:
        - Dispo
      summary: List run proposals
      description: Returns ranked proposals for a planning run.
      operationId: listDispoRunProposals
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/TripCode'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /mail/messages:
    post:
      tags:
        - Mail
      summary: Send a mail message
      description: Queues an outbound mail message. Duplicate idempotency keys return the existing message.
      operationId: createMailMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailMessageRequest'
      responses:
        '202':
          $ref: '#/components/responses/GenericSuccess'
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/RateLimited'
    get:
      tags:
        - Mail
      summary: List mail messages
      description: Lists outbound mail messages.
      operationId: listMailMessages
      parameters:
        - name: status
          in: query
          description: Message status.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of messages.
          schema:
            type: integer
            maximum: 200
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /mail/messages/{message_id}:
    get:
      tags:
        - Mail
      summary: Get a mail message
      description: Returns message status and details.
      operationId: getMailMessage
      parameters:
        - $ref: '#/components/parameters/MessageId'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '404':
          $ref: '#/components/responses/NotFound'
  /mail/senders:
    get:
      tags:
        - Mail
      summary: List allowed mail senders
      description: Returns the allowed sender list.
      operationId: listMailSenders
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /mail/templates/{key}:
    put:
      tags:
        - Mail
      summary: Upsert a mail template
      description: Creates or updates a mail template.
      operationId: upsertMailTemplate
      parameters:
        - $ref: '#/components/parameters/TemplateKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MailTemplateRequest'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '403':
          $ref: '#/components/responses/Forbidden'
  /mail/templates:
    get:
      tags:
        - Mail
      summary: List mail templates
      description: Returns available mail templates.
      operationId: listMailTemplates
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /kddoc/link:
    post:
      tags:
        - KDDoc
      summary: Create a document link
      description: Creates a time-limited document link.
      operationId: createKddocLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenant_id
                - key
                - exp_days
              properties:
                tenant_id:
                  type: string
                key:
                  type: string
                exp_days:
                  type: integer
                  minimum: 1
                  maximum: 3650
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /kddoc/link/revoke:
    post:
      tags:
        - KDDoc
      summary: Revoke a document link
      description: Revokes a document link.
      operationId: revokeKddocLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenant_id
                - key
              properties:
                tenant_id:
                  type: string
                key:
                  type: string
                reason:
                  type: string
      responses:
        '204':
          description: Link revoked.
        '403':
          $ref: '#/components/responses/Forbidden'
  /kddoc/asset:
    get:
      tags:
        - KDDoc
      summary: Check document assets
      description: Returns hashes of available assets.
      operationId: getKddocAssets
      parameters:
        - $ref: '#/components/parameters/TenantIdRequired'
        - name: sha256
          in: query
          description: Comma-separated SHA-256 hashes.
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
  /kddoc/asset/{sha256}:
    put:
      tags:
        - KDDoc
      summary: Upload a document asset
      description: Uploads a binary document asset of up to 12 MB.
      operationId: putKddocAsset
      parameters:
        - $ref: '#/components/parameters/Sha256'
        - $ref: '#/components/parameters/TenantIdRequired'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Asset uploaded.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          description: Asset exceeds 12 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /kddoc:
    get:
      tags:
        - KDDoc
      summary: List knowledge documents
      description: Lists knowledge documents within a scope.
      operationId: listKddocDocuments
      parameters:
        - $ref: '#/components/parameters/TenantIdRequired'
        - name: scope
          in: query
          description: Document scope.
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
  /kddoc/published:
    get:
      tags:
        - KDDoc
      summary: Get published document
      description: Returns a published or draft document for a DSID.
      operationId: getPublishedKddoc
      parameters:
        - name: dsid
          in: query
          description: Document source identifier.
          required: true
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
  /kddoc/{scope}/{key}:
    get:
      tags:
        - KDDoc
      summary: Get a knowledge document
      description: Returns a scoped knowledge document.
      operationId: getKddoc
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/Key'
        - $ref: '#/components/parameters/TenantIdRequired'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - KDDoc
      summary: Replace a knowledge document
      description: Replaces a scoped knowledge document.
      operationId: putKddoc
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tenant_id
                - data
              properties:
                tenant_id:
                  type: string
                data:
                  type: object
                  additionalProperties: true
      responses:
        '204':
          description: Document replaced.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
        - KDDoc
      summary: Delete a knowledge document
      description: Deletes a scoped knowledge document.
      operationId: deleteKddoc
      parameters:
        - $ref: '#/components/parameters/Scope'
        - $ref: '#/components/parameters/Key'
        - $ref: '#/components/parameters/TenantIdRequired'
      responses:
        '204':
          description: Document deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /kddoc/public/{token}:
    get:
      tags:
        - KDDoc
      summary: View a public document
      description: Returns an HTML viewer for text/html requests or document JSON for application/json requests.
      operationId: getPublicKddoc
      security: []
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200':
          description: Public document.
          content:
            text/html:
              schema:
                type: string
              example: '<html><body>Document</body></html>'
            application/json:
              schema:
                type: object
                required:
                  - id
                  - tenant_id
                  - data
                  - updated_at
                properties:
                  id:
                    type: string
                  tenant_id:
                    type: string
                  data:
                    type: object
                    additionalProperties: true
                  updated_at:
                    type: string
                    format: date-time
        '404':
          $ref: '#/components/responses/NotFound'
  /kddoc/public/{token}/aktuell:
    get:
      tags:
        - KDDoc
      summary: Get current public document changes
      description: Returns the current version and document changes.
      operationId: getPublicKddocChanges
      security: []
      parameters:
        - $ref: '#/components/parameters/Token'
      responses:
        '200':
          $ref: '#/components/responses/GenericSuccess'
        '404':
          $ref: '#/components/responses/NotFound'
  /kddoc/public/{token}/asset/{sha256}:
    get:
      tags:
        - KDDoc
      summary: Get a public document asset
      description: Returns a public binary asset using its stored MIME type.
      operationId: getPublicKddocAsset
      security: []
      parameters:
        - $ref: '#/components/parameters/Token'
        - $ref: '#/components/parameters/Sha256'
      responses:
        '200':
          description: Binary asset.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    BearerAuth:
      type: apiKey
      in: header
      name: Authorization
  parameters:
    TenantId:
      name: tenant_id
      in: query
      description: Tenant identifier.
      schema:
        type: string
    TenantIdRequired:
      name: tenant_id
      in: query
      description: Tenant identifier.
      required: true
      schema:
        type: string
    TripId:
      name: trip_id
      in: path
      description: Trip identifier.
      required: true
      schema:
        type: integer
    BookingId:
      name: booking_id
      in: path
      description: Booking identifier.
      required: true
      schema:
        type: string
    CustomerId:
      name: customer_id
      in: path
      description: Customer identifier.
      required: true
      schema:
        type: integer
    PersonId:
      name: person_id
      in: path
      description: Person identifier.
      required: true
      schema:
        type: integer
    NoteId:
      name: note_id
      in: path
      description: Note identifier.
      required: true
      schema:
        type: integer
    Dataset:
      name: dataset
      in: path
      description: Aggregate dataset name.
      required: true
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      description: Opaque pagination cursor.
      schema:
        type: string
    Limit500:
      name: limit
      in: query
      description: Maximum number of results.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    Limit50:
      name: limit
      in: query
      description: Maximum number of results.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 10
    Limit2000:
      name: limit
      in: query
      description: Maximum number of results.
      schema:
        type: integer
        minimum: 1
        maximum: 2000
        default: 200
    Offset:
      name: offset
      in: query
      description: Number of results to skip.
      schema:
        type: integer
        minimum: 0
    TripCode:
      name: trip_code
      in: query
      description: Trip code.
      schema:
        type: string
    TripCodeRequired:
      name: trip_code
      in: query
      description: Trip code.
      required: true
      schema:
        type: string
    DepartureDateRequired:
      name: departure_date
      in: query
      description: Departure date.
      required: true
      schema:
        type: string
        format: date
    SurveyId:
      name: survey_id
      in: path
      description: Survey identifier.
      required: true
      schema:
        type: integer
    Metric:
      name: metric
      in: path
      description: Metric name.
      required: true
      schema:
        type: string
    RuleId:
      name: rule_id
      in: path
      description: Rule identifier.
      required: true
      schema:
        type: integer
    First500:
      name: first
      in: query
      description: Maximum number of results.
      schema:
        type: integer
        minimum: 1
        maximum: 500
    First5000:
      name: first
      in: query
      description: Maximum number of results.
      schema:
        type: integer
        minimum: 1
        maximum: 5000
    First1000:
      name: first
      in: query
      description: Maximum number of results.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    EmailPath:
      name: email
      in: path
      description: Subscriber email address.
      required: true
      schema:
        type: string
        format: email
    EmailRequired:
      name: email
      in: query
      description: Inbox email address.
      required: true
      schema:
        type: string
        format: email
    Endpoint:
      name: endpoint
      in: path
      description: Webhook endpoint identifier.
      required: true
      schema:
        type: string
    ItemId:
      name: item_id
      in: path
      description: Inbox item identifier.
      required: true
      schema:
        type: integer
    ReferenceKind:
      name: kind
      in: path
      description: Reference data kind.
      required: true
      schema:
        type: string
    AssignmentId:
      name: assignment_id
      in: path
      description: Assignment identifier.
      required: true
      schema:
        type: integer
    RunId:
      name: run_id
      in: path
      description: Planning run identifier.
      required: true
      schema:
        type: integer
    MessageId:
      name: message_id
      in: path
      description: Mail message UUID.
      required: true
      schema:
        type: string
        format: uuid
    TemplateKey:
      name: key
      in: path
      description: Template key.
      required: true
      schema:
        type: string
    Sha256:
      name: sha256
      in: path
      description: SHA-256 asset hash.
      required: true
      schema:
        type: string
    Scope:
      name: scope
      in: path
      description: Knowledge document scope.
      required: true
      schema:
        type: string
    Key:
      name: key
      in: path
      description: Knowledge document key.
      required: true
      schema:
        type: string
    Token:
      name: token
      in: path
      description: Public document token.
      required: true
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: Entity tag from a previous response.
      schema:
        type: string
    FeedbackFilters:
      name: tenant_id
      in: query
      description: Tenant identifier.
      schema:
        type: string
  responses:
    GenericSuccess:
      description: Request completed successfully.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    BadRequest:
      description: Invalid request, filter, cursor, or query.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: User has no access or operation is disabled.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Resource conflict.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Service temporarily unavailable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
        - detail
      properties:
        detail:
          type: string
        code:
          type: string
    TripSummary:
      type: object
      required:
        - id
        - code
        - name
        - category
        - destination
        - price
        - duration
        - rating
        - is_new
      properties:
        id:
          type: integer
        code:
          type: string
        name:
          type: string
        category:
          type: string
        destination:
          type: string
        price:
          type: number
        duration:
          type: integer
        rating:
          type: number
        is_new:
          type: boolean
    Trip:
      allOf:
        - $ref: '#/components/schemas/TripSummary'
        - type: object
          required:
            - tenant
            - country_ids
            - departure_dates
          properties:
            tenant:
              type: string
            ship:
              type: string
            country_ids:
              type: array
              items:
                type: integer
            departure_dates:
              type: array
              items:
                type: string
                format: date
    Booking:
      type: object
      required:
        - id
        - trip_id
        - customer_id
        - status
      properties:
        id:
          type: string
        trip_id:
          type: integer
        customer_id:
          type: integer
        status:
          type: string
        participants:
          type: array
          items:
            type: object
            additionalProperties: true
        invoices:
          type: array
          items:
            type: object
            additionalProperties: true
        services:
          type: array
          items:
            type: object
            additionalProperties: true
        address:
          type: object
          additionalProperties: true
        club_member:
          type: object
          additionalProperties: true
    Customer:
      type: object
      required:
        - customer_id
        - is_internal
        - persons
        - bookings_summary
        - address
        - club_member
      properties:
        customer_id:
          type: integer
        is_internal:
          type: boolean
        persons:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        bookings_summary:
          type: object
          additionalProperties: true
        address:
          type: object
          additionalProperties: true
        club_member:
          type: object
          additionalProperties: true
    Person:
      type: object
      additionalProperties: true
      properties:
        id:
          type: integer
        first_name:
          type: string
        last_name:
          type: string
    Note:
      type: object
      required:
        - id
        - entity_type
        - entity_key
        - author_oid
        - author_name
        - content
        - origin
        - created_at
        - updated_at
      properties:
        id:
          type: integer
        entity_type:
          type: string
        entity_key:
          type: string
        author_oid:
          type: string
        author_name:
          type: string
        flag:
          type: string
        content:
          $ref: '#/components/schemas/NoteContent'
        origin:
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NoteContent:
      type: object
      required:
        - md
      properties:
        md:
          type: string
        ui:
          type: object
          additionalProperties: true
    CreateNoteRequest:
      type: object
      required:
        - entity_type
        - entity_key
        - content
      properties:
        entity_type:
          type: string
          enum:
            - booking
            - trip
            - customer
        entity_key:
          type: string
        tenant_id:
          type: string
        flag:
          type: string
        content:
          $ref: '#/components/schemas/NoteContent'
        origin:
          type: object
          additionalProperties: true
        author_name:
          type: string
    UpdateNoteRequest:
      type: object
      properties:
        flag:
          type: string
          nullable: true
        content:
          type: object
          properties:
            md:
              type: string
            ui:
              type: object
              additionalProperties: true
    Survey:
      type: object
      required:
        - id
        - created_at
        - last_changed_at
        - departure
        - trip_code
        - trip_name
        - dossier_number
        - ratings
      properties:
        id:
          type: integer
        created_at:
          type: string
          format: date-time
        last_changed_at:
          type: string
          format: date-time
        departure:
          type: string
          format: date-time
        trip_code:
          type: string
        trip_name:
          type: string
        dossier_number:
          type: integer
        driver_first_name:
          type: string
        driver_last_name:
          type: string
        ratings:
          type: array
          items:
            type: object
            additionalProperties: true
    PaginatedResponse:
      type: object
      required:
        - data
        - next_cursor
        - limit
      properties:
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        next_cursor:
          type: string
          nullable: true
        limit:
          type: integer
    PaginatedTripResponse:
      type: object
      required:
        - data
        - next_cursor
        - limit
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TripSummary'
        next_cursor:
          type: string
          nullable: true
        limit:
          type: integer
    PaginatedBookingResponse:
      type: object
      required:
        - data
